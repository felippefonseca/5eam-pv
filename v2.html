<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5º EAM · Página direta | Encontro Anual de Mecânicos</title>
<meta name="description" content="Versão direta da página do 5º EAM: dois dias de imersão presencial para donos de oficina. 10 e 11 de outubro de 2026, Hotel Serra Jundiaí. Lote atual R$ 397.">
<link rel="canonical" href="https://5eam-pv.vercel.app/v2">
<meta name="theme-color" content="#0B0E14">
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#0B0E14;color:#F2F4F7;font-family:Arial,Helvetica,sans-serif}
  .v2-loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:32px}
  .v2-loading strong{display:block;font-size:18px;margin-bottom:8px}
  .v2-loading span{color:#9AA4B2;font-size:14px}
</style>
</head>
<body>
<div class="v2-loading">
  <div>
    <strong>Carregando 5º EAM</strong>
    <span>Preparando a versão direta da página.</span>
  </div>
</div>
<script>
(function(){
  'use strict';

  var SOURCE_URL = '/index.html?v=20260928-v2-source';

  var V2_CSS = [
    'body.pagina-v2 #retorno,',
    'body.pagina-v2 #bastidores,',
    'body.pagina-v2 .secao-ambiente-v2,',
    'body.pagina-v2 #historia,',
    'body.pagina-v2 #paraquem,',
    'body.pagina-v2 .secao-equipe-v2,',
    'body.pagina-v2 .secao-condicoes-v2{display:none!important}',
    'body.pagina-v2 .hero .rolar{display:none!important}'
  ].join('\n');

  function v2Runtime(){
    var phoneUrl = 'https://wa.me/5511913496405';
    var baseMessage = 'Olá, quero garantir minha vaga no 5º EAM.';
    var params = new URLSearchParams(window.location.search);
    var utms = [];

    ['utm_source','utm_medium','utm_campaign','utm_content','utm_term'].forEach(function(key){
      var value = params.get(key);
      if (value) utms.push(key + '=' + value);
    });

    function buildWhatsApp(position){
      var msg = baseMessage + ' Vim pela página V2 enxuta.';
      if (position) msg += ' CTA: ' + position + '.';
      if (utms.length) msg += ' Origem: ' + utms.join(' | ');
      return phoneUrl + '?text=' + encodeURIComponent(msg);
    }

    function fireContact(position){
      if (typeof window.fbq === 'function') {
        window.fbq('track', 'Contact', {
          content_name: '5EAM V2 Enxuta WhatsApp',
          cta_position: position || 'cta'
        });
        window.fbq('trackCustom', 'WhatsAppClick', {
          page: 'v2-enxuta',
          cta_position: position || 'cta'
        });
      }
    }

    function labelFrom(el){
      return (el.textContent || el.getAttribute('aria-label') || 'cta').trim().slice(0, 80);
    }

    function normalizeCtaText(el){
      el.textContent = 'Garantir minha vaga';
    }

    function linkFromButton(button){
      var a = document.createElement('a');
      Array.prototype.slice.call(button.attributes).forEach(function(attr){
        if (attr.name === 'type' || attr.name === 'data-ir-preco' || attr.name === 'data-abrir-form') return;
        a.setAttribute(attr.name, attr.value);
      });
      a.className = button.className;
      a.innerHTML = button.innerHTML;
      a.setAttribute('data-v2-zap', '');
      a.setAttribute('href', buildWhatsApp(labelFrom(button)));
      button.parentNode.replaceChild(a, button);
      return a;
    }

    function prepareWhatsAppCtas(){
      document.querySelectorAll('[data-ir-preco], [data-abrir-form]').forEach(function(cta){
        normalizeCtaText(cta);
        cta.removeAttribute('data-ir-preco');
        cta.removeAttribute('data-abrir-form');
        cta.setAttribute('data-v2-zap', '');
        if (cta.tagName && cta.tagName.toLowerCase() === 'a') {
          cta.setAttribute('href', buildWhatsApp(labelFrom(cta)));
        } else if (cta.parentNode) {
          linkFromButton(cta);
        }
      });

      document.querySelectorAll('[data-v2-zap]').forEach(function(cta){
        cta.setAttribute('href', buildWhatsApp(labelFrom(cta)));
      });
    }

    document.addEventListener('click', function(event){
      var cta = event.target.closest('[data-v2-zap]');
      if (!cta) return;
      event.preventDefault();
      event.stopPropagation();
      event.stopImmediatePropagation();
      var position = labelFrom(cta);
      var url = cta.getAttribute('href') || buildWhatsApp(position);
      fireContact(position);
      setTimeout(function(){ window.location.assign(url); }, 260);
    }, true);

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', prepareWhatsAppCtas);
    } else {
      prepareWhatsAppCtas();
    }
    setTimeout(prepareWhatsAppCtas, 400);
  }

  function injectClass(attrs){
    if (/class\s*=/.test(attrs)) {
      return attrs.replace(/class=(["'])(.*?)\1/i, function(_, quote, value){
        return 'class=' + quote + value + ' pagina-v2' + quote;
      });
    }
    return attrs + ' class="pagina-v2"';
  }

  function enhance(html){
    html = html.replace(/<title>[\s\S]*?<\/title>/i, '<title>5º EAM · Página direta | Encontro Anual de Mecânicos</title>');
    html = html.replace(/<meta name="description"[^>]*>/i, '<meta name="description" content="Versão direta da página do 5º EAM: dois dias de imersão presencial para donos de oficina. 10 e 11 de outubro de 2026, Hotel Serra Jundiaí. Lote atual R$ 397.">');
    html = html.replace(/<link rel="canonical"[^>]*>/i, '<link rel="canonical" href="https://5eam-pv.vercel.app/v2">');
    html = html.replace(/<body\b([^>]*)>/i, function(match, attrs){
      return '<body' + injectClass(attrs || '') + '>';
    });
    html = html.replace('<!-- ================= BLOCO 8 · AMBIENTE ================= -->\n<section class="virada esq">', '<!-- ================= BLOCO 8 · AMBIENTE ================= -->\n<section class="virada esq secao-ambiente-v2">');
    html = html.replace('<!-- ================= BLOCO 12 · EXPANSÃO DE TICKET ================= -->\n<section class="grid-bg">', '<!-- ================= BLOCO 12 · EXPANSÃO DE TICKET ================= -->\n<section class="grid-bg secao-equipe-v2">');
    html = html.replace('<!-- ================= BLOCO 13 · CONDIÇÕES ================= -->\n<section>', '<!-- ================= BLOCO 13 · CONDIÇÕES ================= -->\n<section class="secao-condicoes-v2">');
    html = html.replace(/<\/head>/i, '<style>' + V2_CSS + '</style></head>');
    return html;
  }

  fetch(SOURCE_URL, { cache: 'no-store' })
    .then(function(response){
      if (!response.ok) throw new Error('Nao foi possivel carregar a pagina principal.');
      return response.text();
    })
    .then(function(html){
      document.open();
      document.write(enhance(html));
      document.close();
      v2Runtime();
    })
    .catch(function(error){
      document.body.innerHTML = '<div class="v2-loading"><div><strong>Não foi possível carregar a página.</strong><span>' + error.message + '</span></div></div>';
    });
})();
</script>
</body>
</html>
